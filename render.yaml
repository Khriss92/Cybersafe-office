databases:
  - name: cybersafe-office-db
    plan: free
    databaseName: cybersafe_office

services:
  - type: web
    name: cybersafe-office
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybersafe-office-db
          property: connectionString
